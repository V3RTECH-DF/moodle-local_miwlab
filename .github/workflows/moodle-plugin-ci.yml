# Continuous integration of local_miwlab with moodle-plugin-ci, the same tool the Moodle Marketplace runs on submission.
# Every Moodle version the plugin declares ($plugin->supported) on PostgreSQL and MariaDB, plus MySQL on the oldest and newest
# maintained versions.
name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: 'utf8mb4'
          MYSQL_COLLATION_SERVER: 'utf8mb4_unicode_ci'
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

      mysql:
        image: ${{ matrix.database == 'mysqli' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle-branch: 'MOODLE_401_STABLE', php: '8.1', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_401_STABLE', php: '8.1', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_405_STABLE', php: '8.3', database: 'mysqli' }
          - { moodle-branch: 'MOODLE_500_STABLE', php: '8.3', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_500_STABLE', php: '8.3', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_501_STABLE', php: '8.3', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_501_STABLE', php: '8.3', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_502_STABLE', php: '8.3', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_503_STABLE', php: '8.3', database: 'pgsql' }
          - { moodle-branch: 'MOODLE_503_STABLE', php: '8.3', database: 'mariadb' }
          - { moodle-branch: 'MOODLE_503_STABLE', php: '8.3', database: 'mysqli' }

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # Informational, as in the moodle-plugin-ci template: shows the report, never fails.
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      # No Mustache templates, JavaScript (AMD/YUI), stylesheets or Behat features in this plugin: the mustache, grunt and
      # behat steps of the template have nothing to check, so they are left out.

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
